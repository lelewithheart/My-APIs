openapi: 3.0.3
info:
  title: Local Grant Matcher API
  version: 1.0.0
  description: Matches users and small businesses to local grants.
paths:
  /v1/grants/match:
    post:
      summary: Find grants for a profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location, applicantType, annualIncome]
              properties:
                location: { type: string }
                applicantType: { type: string, enum: [individual, nonprofit, business] }
                annualIncome: { type: number, minimum: 0 }
      responses:
        "200":
          description: Matching grants.
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        programName: { type: string }
                        maxAward: { type: number }
                        deadline: { type: string, format: date }

